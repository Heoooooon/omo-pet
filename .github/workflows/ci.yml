name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build # tsc + vite + scripts/check-bundle.mjs (originals-only guard)
      - run: node --check scripts/license.mjs
      - run: npm test # bundle guard + default roster behavior
      - name: Only the bundled original and licensed packs are tracked
        # omo, jabdori: licensed from Sisyphus Labs (OmO Native), see scripts/check-bundle.mjs
        run: |
          extra=$(git ls-files public/packs | grep -v -E '^public/packs/((omo|omo-cat|jabdori|dalli|bara|dochi|rupa)/[^/]+\.apng|packs\.json)$' || true)
          if [ -n "$extra" ]; then echo "Unexpected files in public/packs:"; echo "$extra"; exit 1; fi

  tauri:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: mkdir -p dist # tauri's generate_context! expects frontendDist to exist
      - run: cargo check --locked
        working-directory: src-tauri
      - run: cargo test --locked --lib
        working-directory: src-tauri
