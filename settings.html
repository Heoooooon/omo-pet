<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="settingsTitle">Pet settings</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
        font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
      }
      #card {
        display: flex;
        flex-direction: column;
        height: 100%;
        border-radius: 14px;
        background: rgba(22, 22, 28, 0.94);
        color: #eee;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px 10px;
        cursor: grab;
      }
      header h1 {
        font-size: 14px;
        font-weight: 700;
      }
      #close {
        border: none;
        background: rgba(255, 255, 255, 0.1);
        color: #ddd;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        font-size: 12px;
        cursor: pointer;
        line-height: 1;
      }
      #close:hover {
        background: rgba(220, 60, 80, 0.9);
        color: #fff;
      }
      main {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 2px 14px 10px;
        display: flex;
        flex-direction: column;
        gap: 11px;
      }
      .row label {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #bbb;
        margin-bottom: 4px;
      }
      .row output {
        color: #fff;
        font-variant-numeric: tabular-nums;
      }
      #language {
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        padding: 5px 8px;
        font: inherit;
        font-size: 12px;
        background: #1b1b20;
        color: #eee;
      }
      input[type="range"] {
        width: 100%;
        accent-color: #ff8a3d;
      }
      .seg {
        display: flex;
        gap: 6px;
      }
      .seg button {
        flex: 1;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        padding: 6px 0;
        font-size: 12px;
        background: rgba(255, 255, 255, 0.06);
        color: #ccc;
        cursor: pointer;
      }
      .seg button.active {
        background: #ff8a3d;
        border-color: #ff8a3d;
        color: #1b1b20;
        font-weight: 700;
      }
      .toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12.5px;
        color: #ddd;
        padding: 2px 0;
      }
      .toggle input {
        appearance: none;
        width: 36px;
        height: 21px;
        border-radius: 11px;
        background: rgba(255, 255, 255, 0.16);
        position: relative;
        cursor: pointer;
        transition: background 0.15s;
        flex-shrink: 0;
      }
      .toggle input:checked {
        background: #ff8a3d;
      }
      .toggle input::after {
        content: "";
        position: absolute;
        top: 2.5px;
        left: 2.5px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.15s;
      }
      .toggle input:checked::after {
        transform: translateX(15px);
      }
      footer {
        padding: 0 14px 12px;
      }
      #reset {
        width: 100%;
        border: none;
        border-radius: 8px;
        padding: 7px 0;
        font-size: 12px;
        background: rgba(255, 255, 255, 0.1);
        color: #ccc;
        cursor: pointer;
      }
      #reset:hover {
        background: rgba(255, 255, 255, 0.18);
      }
      hr {
        border: none;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .seg {
        flex-wrap: wrap;
      }
      .seg button {
        flex: 1 1 30%;
        padding: 6px 4px;
      }
      #tabs {
        display: flex;
        gap: 4px;
        padding: 0 14px 8px;
      }
      #tabs button {
        flex: 1;
        border: none;
        border-radius: 8px;
        padding: 6px 0;
        font: inherit;
        font-size: 12.5px;
        background: rgba(255, 255, 255, 0.06);
        color: #bbb;
        cursor: pointer;
      }
      #tabs button.active {
        background: rgba(255, 138, 61, 0.18);
        color: #ffb27d;
        font-weight: 700;
      }
      .panel[hidden] {
        display: none;
      }
      select.full,
      input.full {
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        padding: 5px 8px;
        font: inherit;
        font-size: 12px;
        background: #1b1b20;
        color: #eee;
      }
      .roster {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 8px;
        align-items: center;
        font-size: 12px;
        color: #bbb;
      }
      .btn {
        border: none;
        border-radius: 8px;
        padding: 7px 10px;
        font: inherit;
        font-size: 12px;
        background: rgba(255, 255, 255, 0.1);
        color: #ddd;
        cursor: pointer;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.18);
      }
      .btn.primary {
        background: #ff8a3d;
        color: #1b1b20;
        font-weight: 700;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .btn.wide {
        width: 100%;
      }
      .hint {
        font-size: 11px;
        line-height: 1.45;
        color: #9a9aa4;
      }
      .notice {
        font-size: 11.5px;
        line-height: 1.45;
        color: #ffd6a8;
        background: rgba(255, 138, 61, 0.12);
        border: 1px solid rgba(255, 138, 61, 0.3);
        border-radius: 8px;
        padding: 7px 9px;
      }
      h2 {
        font-size: 12.5px;
        color: #eee;
      }
      #tools li,
      #steps li {
        list-style: none;
        font-size: 11.5px;
        line-height: 1.5;
        color: #ccc;
      }
      #steps li[data-status="run"] {
        color: #ffb27d;
      }
      #steps li[data-status="done"] {
        color: #8bd96b;
      }
      #steps li[data-status="fail"] {
        color: #ff8080;
      }
      #pick-row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #pick-thumb {
        width: 48px;
        height: 48px;
        object-fit: contain;
        border-radius: 8px;
        background: #fff;
      }
      #previews {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
      }
      #previews figure {
        border-radius: 8px;
        background: repeating-conic-gradient(#d9d9de 0 25%, #f4f4f6 0 50%) 0 0 / 16px 16px;
        padding: 4px;
        text-align: center;
      }
      #previews.dark figure {
        background: #1d1d22;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      #previews img {
        height: 96px;
        max-width: 100%;
        object-fit: contain;
      }
      #previews figcaption {
        font-size: 10.5px;
        color: #555;
      }
      #previews.dark figcaption {
        color: #aaa;
      }
      .actions {
        display: flex;
        gap: 6px;
      }
      .actions .btn {
        flex: 1;
      }
      #mypacks li {
        list-style: none;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        padding: 3px 0;
      }
      #mypacks li span {
        flex: 1;
      }
      .msg {
        font-size: 11.5px;
        color: #8bd96b;
      }
      .msg.err {
        color: #ff8080;
      }
      h3 {
        margin: 10px 0 2px;
        font-size: 12px;
      }
      ul.list {
        margin: 2px 0 6px;
        padding-left: 18px;
        font-size: 12px;
        line-height: 1.6;
      }
      #license-entry {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #license-entry[hidden] {
        display: none;
      }
      #license-key {
        font: 11px ui-monospace, monospace;
        background: rgba(255, 255, 255, 0.08);
        color: inherit;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        padding: 6px;
        resize: none;
        word-break: break-all;
      }
      #packs button.locked {
        opacity: 0.55;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <header id="drag">
        <h1 data-i18n="settingsHeading">🐾 Pet settings</h1>
        <button id="close" title="Close" aria-label="Close" data-i18n-title="close" data-i18n-aria-label="close">✕</button>
      </header>
      <nav id="tabs">
        <button type="button" data-tab="pet" class="active" data-i18n="tabPet">Pet</button>
        <button type="button" data-tab="band" data-i18n="tabBand">Band</button>
        <button type="button" data-tab="custom" data-i18n="tabCustom">My character</button>
      </nav>
      <main class="panel" id="panel-pet">
        <div class="row">
          <label for="language" data-i18n="language">Language</label>
          <select id="language">
            <option value="en" lang="en">English</option>
            <option value="ko" lang="ko">한국어</option>
          </select>
        </div>
        <div class="row">
          <label data-i18n="character">Character</label>
          <div id="packs" class="seg"></div>
        </div>
        <div class="row">
          <label for="size"><span data-i18n="size">Size</span> <output id="size-out"></output></label>
          <input id="size" type="range" min="50" max="120" step="5" />
        </div>
        <div class="row">
          <label for="speed"><span data-i18n="speed">Walking speed</span> <output id="speed-out"></output></label>
          <input id="speed" type="range" min="50" max="200" step="10" />
        </div>
        <div class="row">
          <label for="activity"><span data-i18n="activity">Activity (how often your pet moves)</span> <output id="activity-out"></output></label>
          <input id="activity" type="range" min="30" max="300" step="10" />
        </div>
        <div class="row">
          <label for="stunts"><span data-i18n="stunts">Rocket &amp; jet frequency</span> <output id="stunts-out"></output></label>
          <input id="stunts" type="range" min="0" max="200" step="10" />
        </div>
        <hr />
        <label class="toggle">
          <span data-i18n="crossMonitors">Move between monitors</span>
          <input id="crossMonitors" type="checkbox" />
        </label>
        <label class="toggle">
          <span data-i18n="ipadHandoff">Hop over to iPad (Lanbeam)</span>
          <input id="ipadHandoff" type="checkbox" />
        </label>
        <p class="hint" data-i18n="credits"></p>
      </main>
      <main class="panel" id="panel-band" hidden>
        <section id="store" hidden>
          <h2 data-i18n="storeTitle">Band pack</h2>
          <p class="hint" data-i18n="storeLead"></p>
          <h3 data-i18n="storeUnlocks">What buying unlocks</h3>
          <ul class="list">
            <li data-i18n="storeItemFriends"></li>
            <li data-i18n="storeItemBand"></li>
            <li data-i18n="storeItemSlots"></li>
          </ul>
          <h3 data-i18n="storeFree">Free forever</h3>
          <ul class="list">
            <li data-i18n="storeFreeOmo"></li>
            <li data-i18n="storeFreeSlot"></li>
          </ul>
          <p class="hint" data-i18n="storeWhere"></p>
        </section>
        <div id="band-controls">
        <button id="band-now" class="btn primary wide" type="button" data-i18n="bandNow">Open the band now</button>
        <p class="hint" data-i18n="bandHint"></p>
        <h2 data-i18n="bandMembers">Members</h2>
        <div id="roster" class="roster"></div>
        <hr />
        <label class="toggle">
          <span data-i18n="bandSound">Band music sound</span>
          <input id="bandSound" type="checkbox" />
        </label>
        <div class="row">
          <label for="bandVolume"><span data-i18n="bandVolume">Band volume</span> <output id="bandVolume-out"></output></label>
          <input id="bandVolume" type="range" min="0" max="100" step="5" />
        </div>
        <label class="toggle">
          <span data-i18n="bandRandom">Sometimes gather on their own</span>
          <input id="bandRandom" type="checkbox" />
        </label>
        </div>
        <hr />
        <section id="license">
          <h2 data-i18n="licenseTitle">License</h2>
          <p id="license-state" class="hint"></p>
          <div id="license-entry">
            <button id="license-file" class="btn primary wide" type="button" data-i18n="licenseImport">Import license file</button>
            <textarea id="license-key" rows="3" spellcheck="false"></textarea>
            <button id="license-apply" class="btn wide" type="button" data-i18n="licenseApply">Unlock with key</button>
          </div>
          <p id="license-msg" class="msg" hidden></p>
          <button id="license-remove" class="btn" type="button" data-i18n="licenseRemove" hidden>Remove license from this computer</button>
        </section>
      </main>
      <main class="panel" id="panel-custom" hidden>
        <h2 data-i18n="customTitle">Make my character</h2>
        <p class="notice" data-i18n="rightsNotice"></p>
        <p class="hint" data-i18n="privacyNote"></p>
        <div>
          <p class="hint" data-i18n="toolsTitle"></p>
          <ul id="tools"></ul>
          <button id="recheck" class="btn" type="button" data-i18n="recheck">Check again</button>
        </div>
        <div id="pick-row">
          <img id="pick-thumb" alt="" hidden />
          <button id="pick" class="btn" type="button" data-i18n="pickImage">Choose picture</button>
        </div>
        <div class="row">
          <label for="cname" data-i18n="charName">Name</label>
          <input id="cname" class="full" maxlength="20" />
        </div>
        <div class="row">
          <label for="cinst" data-i18n="charInstrument">Band instrument</label>
          <select id="cinst" class="full"></select>
        </div>
        <button id="create" class="btn primary wide" type="button"></button>
        <p id="still-note" class="hint" data-i18n="stillOnlyNote" hidden></p>
        <p id="create-msg" class="msg" hidden></p>
        <div id="progress" hidden>
          <ul id="steps"></ul>
          <p class="hint" data-i18n="working"></p>
        </div>
        <div id="result" hidden>
          <h2 data-i18n="previewTitle">Preview</h2>
          <div id="previews"></div>
          <div class="actions">
            <button id="bg-toggle" class="btn" type="button" data-i18n="bgToggle">◐ Background</button>
            <button id="discard" class="btn" type="button" data-i18n="discard">Discard</button>
            <button id="save" class="btn primary" type="button" data-i18n="save">Save</button>
          </div>
        </div>
        <hr />
        <h2 data-i18n="importTitle">Import a pack</h2>
        <p class="hint" data-i18n="importHint"></p>
        <div class="actions">
          <button id="import-folder" class="btn" type="button" data-i18n="importFolder">From folder</button>
          <button id="import-zip" class="btn" type="button" data-i18n="importZip">From zip</button>
        </div>
        <p id="import-msg" class="msg" hidden></p>
        <h2 data-i18n="myPacks">My packs</h2>
        <p id="slot-note" class="hint" hidden></p>
        <ul id="mypacks"></ul>
      </main>
      <footer id="footer">
        <button id="reset" data-i18n="reset">Reset pet settings</button>
      </footer>
    </div>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
